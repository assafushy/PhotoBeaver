appId: app.photobeaver.desktop
productName: Photo Beaver
directories:
  output: release
  buildResources: build
files:
  - out/**
  - '!out/main/default-plugins/**'
  - package.json
extraResources:
  - from: out/main/default-plugins
    to: plugins
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/ffmpeg-static/**'
npmRebuild: false
mac:
  category: public.app-category.photography
  target: dmg
  notarize: false
win:
  target: nsis
linux:
  target: AppImage
  category: Graphics
publish:
  provider: github
