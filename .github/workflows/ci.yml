name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
        if: matrix.os == 'ubuntu-latest'

      - run: pnpm lint

      - name: Functions at most 20 lines
        if: matrix.os == 'ubuntu-latest'
        run: pnpm check:fn

      - run: pnpm typecheck

      - name: Cache face models (real-model test, Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/face-models
          key: insightface-buffalo_l-80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f

      - name: Download face models (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/face-models"
          if [ ! -f "$dir/w600k_r50.onnx" ]; then
            mkdir -p "$dir" && cd "$dir"
            curl -sSL -o buffalo_l.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
            echo "80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f  buffalo_l.zip" | sha256sum -c -
            unzip -q buffalo_l.zip det_10g.onnx w600k_r50.onnx && rm buffalo_l.zip
          fi
          echo "PB_FACE_MODELS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Test (two packages at a time, so CPU-heavy suites keep their timeouts)
        run: pnpm exec turbo run test --concurrency=2

      - run: pnpm build

      - name: Download Electron binary
        run: pnpm --filter @photobeaver/desktop exec install-electron

      - name: Allow Electron sandbox on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum pnpm --filter @photobeaver/desktop e2e

      - name: E2E
        if: matrix.os != 'ubuntu-latest'
        run: pnpm --filter @photobeaver/desktop e2e

      - name: Collect app logs and leftover processes
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match 'electron|Photo' } | Format-Table Id, ProcessName, StartTime -AutoSize | Out-String | Write-Host
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          Get-ChildItem ([System.IO.Path]::GetTempPath()) -Directory -Filter 'pb-e2e-*' | ForEach-Object {
            if (Test-Path (Join-Path $_.FullName 'logs')) { Copy-Item (Join-Path $_.FullName 'logs') (Join-Path 'e2e-logs' $_.Name) -Recurse }
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e-logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
