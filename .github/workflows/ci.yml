name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
        if: matrix.os == 'ubuntu-latest'

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Test (two packages at a time, so CPU-heavy suites keep their timeouts)
        run: pnpm exec turbo run test --concurrency=2

      - run: pnpm build

      - name: Download Electron binary
        run: pnpm --filter @photobeaver/desktop exec install-electron

      - name: Allow Electron sandbox on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum pnpm --filter @photobeaver/desktop e2e

      - name: E2E
        if: matrix.os != 'ubuntu-latest'
        run: pnpm --filter @photobeaver/desktop e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
